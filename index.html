<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warehouse Receiving — the clerk's side of the dock</title>
    <meta
      name="description"
      content="A receiving desk for a Spring Boot warehouse API: look up a purchase order, record partial deliveries and damaged units against the 110% over-receipt rule, and watch stock follow. Live demo by David Guijosa."
    />
    <!-- Tracks --paper, the page background, and is rewritten by the script below. -->
    <meta name="theme-color" content="#eef1f6" />
    <link rel="canonical" href="https://www.zntsns.com/warehouse/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="zntsns — David Guijosa Infante" />
    <meta property="og:url" content="https://www.zntsns.com/warehouse/" />
    <meta property="og:title" content="Warehouse Receiving — the clerk's side of the dock" />
    <meta
      property="og:description"
      content="React and TypeScript front end for a Spring Boot receiving API. Partial deliveries, over-shipments, damaged units, and JWT-gated roles."
    />
    <meta property="og:image" content="https://www.zntsns.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Warehouse Receiving — the clerk's side of the dock" />
    <meta
      name="twitter:description"
      content="React and TypeScript front end for a Spring Boot receiving API. Partial deliveries, over-shipments, damaged units, and JWT-gated roles."
    />
    <meta name="twitter:image" content="https://www.zntsns.com/og.jpg" />
    <script>
      // Runs before first paint so a stored preference never flashes the other
      // theme. Key and fallback must stay in step with src/theme.ts, which
      // cannot be imported here — this has to execute before the bundle loads.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("warehouse.theme");
        } catch (e) {
          theme = null;
        }
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0e1115" : "#eef1f6");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
